app = "jst-server"
primary_region = "iad"
kill_timeout = "30s"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 192
    hard_limit = 256

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[env]
  RUST_LOG = "jst_server=info"
  MAX_CONCURRENT_TRANSLATIONS = "256"
  MONTHLY_REQUEST_LIMIT = "1000"
  REQUESTS_PER_MINUTE = "20"
  LLM_API_URL = "https://openrouter.ai/api/v1/chat/completions"
  LLM_MODEL = "microsoft/phi-4"
  LLM_FALLBACK_MODEL = "google/gemma-4-26b-a4b-it:nitro"
  DEMO_ALLOWED_ORIGINS = "https://jst.sh"
  DEMO_MONTHLY_REQUEST_LIMIT = "100"
  DEMO_REQUESTS_PER_MINUTE = "6"
  DEMO_DAILY_REQUESTS_PER_IP = "60"
  DEMO_GLOBAL_DAILY_REQUEST_LIMIT = "1000"
